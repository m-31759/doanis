<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doanis</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f4f1;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .site {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 72px;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 36px;
      z-index: 10;
    }

    .logo {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    nav a {
      color: inherit;
      text-decoration: none;
    }

    .gallery-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .gallery {
      width: 100%;
      overflow: visible;
      touch-action: pan-y;
      cursor: grab;
    }

    .gallery.dragging {
      cursor: grabbing;
    }

    .track {
      display: flex;
      align-items: center;

      /* 사진 사이 간격 */
      gap: 18px;

      will-change: transform;
      backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    .slide {
      /*
        기존 72vw → 58vw
        그래서 양옆 사진이 훨씬 많이 보임
      */
      flex: 0 0 58vw;

      height: calc(100vh - 145px);

      display: flex;
      justify-content: center;
      align-items: center;

      opacity: 0.38;
      transform: scale(0.88);

      transition:
        transform 0.65s cubic-bezier(.77,0,.18,1),
        opacity 0.65s ease;

      backface-visibility: hidden;
    }

    .slide.active {
      opacity: 1;
      transform: scale(1);
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;

      object-fit: contain;
      display: block;

      user-select: none;
      -webkit-user-drag: none;

      backface-visibility: hidden;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      z-index: 20;

      border: 0;
      background: rgba(244, 244, 241, 0.55);
      backdrop-filter: blur(4px);

      width: 46px;
      height: 64px;

      font-size: 34px;
      font-weight: 200;

      cursor: pointer;
      color: #111;
    }

    .prev {
      left: 12px;
    }

    .next {
      right: 12px;
    }

    .counter {
      position: absolute;
      right: 36px;
      bottom: 18px;

      font-size: 12px;
      letter-spacing: 0.12em;

      z-index: 20;
    }

    @media (max-width: 768px) {

      header {
        height: 60px;
        padding: 0 18px;
      }

      .logo {
        font-size: 16px;
      }

      nav {
        gap: 14px;
        font-size: 10px;
      }

      .track {
        gap: 12px;
      }

      /*
        휴대폰에서는 가운데 사진을 조금 더 크게
        그래도 양옆은 보이도록 76vw
      */
      .slide {
        flex-basis: 76vw;
        height: calc(100vh - 125px);
      }

      .arrow {
        width: 38px;
        height: 54px;
        font-size: 28px;
      }

      .counter {
        right: 18px;
        bottom: 12px;
      }
    }
  </style>
</head>

<body>

<div class="site">

  <header>

    <a class="logo" href="https://doanis.kr/">
      DOANIS
    </a>

    <nav>
      <a href="#">WORK</a>
      <a href="#">ABOUT</a>
      <a href="https://blog.doanis.kr">BLOG</a>
    </nav>

  </header>


  <main class="gallery-wrap">

    <button class="arrow prev" id="prev">‹</button>

    <div class="gallery" id="gallery">

      <div class="track" id="track">

        <!-- 마지막 사진 복제 -->
        <div class="slide clone">
          <img src="images/08.jpg" alt="">
        </div>

        <!-- 실제 사진 -->

        <div class="slide">
          <img src="images/01.jpg" alt="">
        </div>

        <div class="slide">
          <img src="images/02.jpg" alt="">
        </div>

        <div class="slide">
          <img src="images/03.jpg" alt="">
        </div>

        <div class="slide">
          <img src="images/04.jpg" alt="">
        </div>

        <div class="slide">
          <img src="images/05.jpg" alt="">
        </div>

        <div class="slide">
          <img src="images/06.jpg" alt="">
        </div>

        <div class="slide">
          <img src="images/07.jpg" alt="">
        </div>

        <div class="slide">
          <img src="images/08.jpg" alt="">
        </div>

        <!-- 첫 사진 복제 -->
        <div class="slide clone">
          <img src="images/01.jpg" alt="">
        </div>

      </div>

    </div>

    <button class="arrow next" id="next">›</button>

    <div class="counter">
      <span id="current">01</span> / 08
    </div>

  </main>

</div>


<script>

  const gallery = document.getElementById('gallery');
  const track = document.getElementById('track');
  const slides = [...document.querySelectorAll('.slide')];
  const currentDisplay = document.getElementById('current');

  const realSlideCount = 8;

  /*
    0 = 복제 08
    1 = 실제 01
    ...
    8 = 실제 08
    9 = 복제 01
  */
  let current = 1;

  let pointerDown = false;
  let startX = 0;
  let currentX = 0;

  let isAnimating = false;

  /*
    휠이 한 번 움직였는데
    여러 장 넘어가는 걸 막기 위한 변수
  */
  let wheelLocked = false;


  function moveToCurrent(animate = true) {

    const slide = slides[current];

    const offset =
      slide.offsetLeft -
      (gallery.clientWidth - slide.offsetWidth) / 2;

    if (animate) {

      track.style.transition =
        'transform 0.65s cubic-bezier(.77,0,.18,1)';

    } else {

      track.style.transition = 'none';

    }

    track.style.transform =
      `translate3d(${-offset}px, 0, 0)`;


    slides.forEach((item, index) => {

      item.classList.toggle(
        'active',
        index === current
      );

    });


    let displayNumber = current;

    if (current === 0) {
      displayNumber = 8;
    }

    if (current === slides.length - 1) {
      displayNumber = 1;
    }

    currentDisplay.textContent =
      String(displayNumber).padStart(2, '0');
  }



  function nextSlide() {

    if (isAnimating) return;

    isAnimating = true;

    current++;

    moveToCurrent(true);
  }



  function prevSlide() {

    if (isAnimating) return;

    isAnimating = true;

    current--;

    moveToCurrent(true);
  }



  /*
    무한 루프 처리
  */
  track.addEventListener('transitionend', (e) => {

    if (e.propertyName !== 'transform') return;


    /*
      복제된 01에 도착했으면
      실제 01로 눈에 안 띄게 이동
    */
    if (current === slides.length - 1) {

      current = 1;

      requestAnimationFrame(() => {

        moveToCurrent(false);

        requestAnimationFrame(() => {

          track.style.transition =
            'transform 0.65s cubic-bezier(.77,0,.18,1)';

          isAnimating = false;

        });

      });

      return;
    }


    /*
      복제된 08에 도착했으면
      실제 08로 이동
    */
    if (current === 0) {

      current = realSlideCount;

      requestAnimationFrame(() => {

        moveToCurrent(false);

        requestAnimationFrame(() => {

          track.style.transition =
            'transform 0.65s cubic-bezier(.77,0,.18,1)';

          isAnimating = false;

        });

      });

      return;
    }


    isAnimating = false;

  });



  /*
    버튼
  */

  document
    .getElementById('next')
    .addEventListener('click', nextSlide);

  document
    .getElementById('prev')
    .addEventListener('click', prevSlide);



  /*
    키보드
  */

  document.addEventListener('keydown', (e) => {

    if (e.key === 'ArrowRight') {
      nextSlide();
    }

    if (e.key === 'ArrowLeft') {
      prevSlide();
    }

  });



  /*
    마우스 / 손가락 드래그
  */

  gallery.addEventListener('pointerdown', (e) => {

    if (isAnimating) return;

    pointerDown = true;

    startX = e.clientX;
    currentX = e.clientX;

    gallery.classList.add('dragging');

    gallery.setPointerCapture(e.pointerId);

  });



  gallery.addEventListener('pointermove', (e) => {

    if (!pointerDown) return;

    currentX = e.clientX;

  });



  gallery.addEventListener('pointerup', () => {

    if (!pointerDown) return;

    pointerDown = false;

    gallery.classList.remove('dragging');

    const diff = currentX - startX;

    if (Math.abs(diff) > 60) {

      if (diff < 0) {
        nextSlide();
      } else {
        prevSlide();
      }

    }

  });



  gallery.addEventListener('pointercancel', () => {

    pointerDown = false;

    gallery.classList.remove('dragging');

  });



  /*
    ★ 마우스 휠 / 트랙패드
  */

  gallery.addEventListener(
    'wheel',
    (e) => {

      /*
        페이지 스크롤 대신
        갤러리 이동으로 사용
      */
      e.preventDefault();


      if (wheelLocked || isAnimating) {
        return;
      }


      /*
        세로 휠과 가로 트랙패드 둘 다 지원
      */
      const movement =
        Math.abs(e.deltaX) > Math.abs(e.deltaY)
          ? e.deltaX
          : e.deltaY;


      /*
        너무 작은 움직임은 무시
      */
      if (Math.abs(movement) < 10) {
        return;
      }


      wheelLocked = true;


      if (movement > 0) {

        nextSlide();

      } else {

        prevSlide();

      }


      /*
        휠 한 번에 여러 장 넘어가는 현상 방지
      */
      setTimeout(() => {

        wheelLocked = false;

      }, 700);

    },

    { passive: false }
  );



  /*
    화면 크기 변경
  */

  window.addEventListener('resize', () => {

    moveToCurrent(false);

  });



  /*
    처음 로딩
  */

  window.addEventListener('load', () => {

    moveToCurrent(false);

  });

</script>

</body>
</html>
