<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doanis</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f3;
      color: #111;
    }

    .site {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
    }

    nav {
      display: flex;
      gap: 28px;
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    nav a {
      color: inherit;
      text-decoration: none;
    }

    .gallery {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    .track {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.65s cubic-bezier(.77,0,.18,1);
    }

    .slide {
      min-width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 80px 30px;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      font-size: 38px;
      font-weight: 200;
      cursor: pointer;
      z-index: 10;
      padding: 20px;
      color: #111;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    .counter {
      position: absolute;
      right: 36px;
      bottom: 20px;
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    @media (max-width: 768px) {
      header {
        height: 60px;
        padding: 0 18px;
      }

      .logo {
        font-size: 16px;
      }

      nav {
        gap: 14px;
        font-size: 10px;
      }

      .slide {
        padding: 10px 24px 40px;
      }

      .arrow {
        font-size: 28px;
        padding: 10px;
      }

      .counter {
        right: 18px;
        bottom: 14px;
      }
    }
  </style>
</head>

<body>

<div class="site">

  <header>
    <div class="logo">DOANIS</div>

    <nav>
      <a href="#">WORK</a>
      <a href="#">ABOUT</a>
      <a href="https://blog.doanis.kr">BLOG</a>
    </nav>
  </header>

  <main class="gallery">

    <div class="track" id="track">
      <div class="slide"><img src="images/01.jpg" alt=""></div>
      <div class="slide"><img src="images/02.jpg" alt=""></div>
      <div class="slide"><img src="images/03.jpg" alt=""></div>
      <div class="slide"><img src="images/04.jpg" alt=""></div>
      <div class="slide"><img src="images/05.jpg" alt=""></div>
      <div class="slide"><img src="images/06.jpg" alt=""></div>
      <div class="slide"><img src="images/07.jpg" alt=""></div>
      <div class="slide"><img src="images/08.jpg" alt=""></div>
    </div>

    <button class="arrow prev" id="prev">‹</button>
    <button class="arrow next" id="next">›</button>

    <div class="counter">
      <span id="current">01</span> / 08
    </div>

  </main>

</div>

<script>
  const track = document.getElementById('track');
  const currentDisplay = document.getElementById('current');
  const slides = document.querySelectorAll('.slide');

  let current = 0;
  let startX = 0;

  function updateGallery() {
    track.style.transform = `translateX(-${current * 100}%)`;
    currentDisplay.textContent = String(current + 1).padStart(2, '0');
  }

  function nextSlide() {
    current = (current + 1) % slides.length;
    updateGallery();
  }

  function prevSlide() {
    current = (current - 1 + slides.length) % slides.length;
    updateGallery();
  }

  document.getElementById('next').addEventListener('click', nextSlide);
  document.getElementById('prev').addEventListener('click', prevSlide);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
  });

  track.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
  });

  track.addEventListener('touchend', (e) => {
    const endX = e.changedTouches[0].clientX;
    const diff = startX - endX;

    if (Math.abs(diff) > 50) {
      if (diff > 0) {
        nextSlide();
      } else {
        prevSlide();
      }
    }
  });
</script>

</body>
</html>
